media:
  input: assets/images/writing
  output: /assets/images/writing
  categories: [image]
  rename: safe

settings:
  content:
    merge: true

content:
  - name: writing
    label: Writing
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - 2025-01-01-music.md
    filename: "{year}-{month}-{day}-{primary}.md"
    operations:
      rename: false
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      search: [title, category]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Article date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: category
        label: Category
        type: string
      - name: body
        label: Article
        type: rich-text
        description: "Save publishes your changes to the site. Use the formatting controls for headings, lists, links, and images."
        options:
          format: markdown
          switcher: true

  # Keep the Music essay's hand-written figure/caption markup intact.
  - name: music
    label: Music (with photo captions)
    type: file
    path: _posts/2025-01-01-music.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Article date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: category
        label: Category
        type: string
      - name: body
        label: Article source
        type: text
        description: "Edit the prose directly. Keep the <figure>, <a>, <img>, and <figcaption> tags around photos to preserve their layout. Save publishes your changes."
